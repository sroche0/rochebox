name: zomboid
services:
  zomboid:
    build:
      context: project_zomboid
      dockerfile: Dockerfile
      args:
        - USER=$PUID
    image: "safetycrab/zomboid-dedicated-server:42.20"
    container_name: ${PROJ_PREFIX}.zomboid
    restart: "unless-stopped"
    ports:
      - "8766:8766/udp"
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    environment:
      # These are the non-secret knobs entry.sh actually reads. They're set here
      # (rather than baked into the Dockerfile or hidden in override.env) so they
      # can be changed with just a container restart -- no image rebuild needed.
      # `environment:` here wins over both the Dockerfile's ENV default and
      # anything set in env_file, so this is the one place to look/edit.
      #
      # Empty tracks Steam's default/public branch, currently Build 42.20. Indie
      # Stone only keeps one numbered checkpoint branch alive at a time (currently
      # "42.19") rather than permanent per-version branches, so pinning to an old
      # point release like 42.13.1 goes stale -- prefer empty unless you have a
      # specific reason to pin.
      - SERVER_BRANCH=
      - SERVER_NAME=pzserver
      - MAX_RAM=8192m
    env_file:
      # ADMIN_USERNAME/ADMIN_PASSWORD (credentials) stay here rather than above.
      - ./.env
      - ./project_zomboid/override.env
    volumes:
      - ${APPDATA}/zomboid/server-files:/home/steam/projectzomboid
      - ${APPDATA}/zomboid/config:/home/steam/Zomboid/
      # - ${CONFIGS}/project_zomboid:/home/steam/Zomboid/Server/
      # Uncomment to edit the steamcmd install script without rebuilding the image:
      # - ./project_zomboid/install.scmd:/home/steam/install.scmd

    # entrypoint: ["tail", "-f", "/dev/null"]
    
