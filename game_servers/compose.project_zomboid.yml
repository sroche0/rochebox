name: zomboid
services:
  zomboid:
    build:
      context: project_zomboid
      dockerfile: Dockerfile
      args:
        - USER=$PUID
        # Empty tracks Steam's default/public branch, which becomes Build 42.20
        # on 2026-07-29. Indie Stone only keeps one numbered checkpoint branch
        # alive at a time (currently "42.19") rather than permanent per-version
        # branches, so pinning to an old point release like 42.13.1 goes stale.
        - SERVER_BRANCH=
    image: "safetycrab/zomboid-dedicated-server:42.20"
    container_name: ${PROJ_PREFIX}.zomboid
    restart: "unless-stopped"
    ports:
      - "8766:8766/udp"
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    environment:
      - GAME_VERSION=public
      - PAUSE_ON_EMPTY=true
      - PUBLIC_SERVER=true
      - USE_STEAM=true
    env_file:
      - ./.env
      - ./project_zomboid/override.env
    volumes:
      - ${APPDATA}/zomboid/server-files:/home/steam/projectzomboid
      - ${APPDATA}/zomboid/config:/home/steam/Zomboid/
      # - ${CONFIGS}/project_zomboid:/home/steam/Zomboid/Server/

    # entrypoint: ["tail", "-f", "/dev/null"]
    
